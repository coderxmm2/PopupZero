
name: Build PopUpZero Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PopUpZero-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Package source ZIP
        run: |
          zip -r PopUpZero-Android-source.zip . -x ".git/*" "app/build/*" ".gradle/*"

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PopUpZero-Android-source
          path: PopUpZero-Android-source.zip
          
