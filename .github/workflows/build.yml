
name: Build PopUpZero ZIP

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package extension
        run: |
          mkdir -p dist
          cd extension
          zip -r ../dist/PopUpZero-v1.0.zip .

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: PopUpZero-v1.0
          path: dist/PopUpZero-v1.0.zip
          if-no-files-found: error
          
