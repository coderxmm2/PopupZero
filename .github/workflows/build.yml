
name: Build PopUpZero Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Find Android project
        run: |
          SETTINGS_FILE=$(find . -type f -name settings.gradle \
            -not -path '*/.gradle/*' -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          PROJECT_DIR="${SETTINGS_FILE%/settings.gradle}"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project at: $PROJECT_DIR"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PopUpZero-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Package source ZIP
        run: |
          cd "$PROJECT_DIR"
          zip -r "$GITHUB_WORKSPACE/PopUpZero-Android-source.zip" . \
            -x ".git/*" "*/build/*" ".gradle/*"

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PopUpZero-Android-source
          path: PopUpZero-Android-source.zip
          if-no-files-found: error
          
